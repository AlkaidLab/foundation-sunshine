name: Build and Release

# Published releases are owned by sign-and-repackage.yml. Keeping that event
# out of this workflow prevents a release created below from starting another
# build-and-release cycle.
#
# Pull requests are routed by what they change (job `changes`): documentation-only, workflow-only and Web UI-only
# changes skip the Windows build, and `ci-gate` is the single check to require. A skipped *job* reports success, while a
# workflow skipped by `on.paths` leaves its checks pending and blocks the merge (GitHub Docs, "Troubleshooting required
# status checks"), so this workflow has no `on.paths`. Pushes to master and manual runs always run everything.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      gui_run_id:
        description: 'Optional successful Panel artifact run; its commit must match the Panel submodule'
        type: string
        default: ''
      rtx_hdr:
        description: 'RTX HDR support for development branches (official master always requires ON)'
        type: choice
        default: AUTO
        options:
          - 'AUTO'
          - 'ON'
          - 'OFF'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# The pinned LizardByte release action still composes a Node.js 20 action.
# Run it on Node.js 24 ahead of GitHub's fall 2026 Node.js 20 removal.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp: ${{ steps.classify.outputs.cpp }}
      webui: ${{ steps.classify.outputs.webui }}
      installer: ${{ steps.classify.outputs.installer }}
      workflow: ${{ steps.classify.outputs.workflow }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_touched: ${{ steps.classify.outputs.docs_touched }}
      # Packaging (Web UI build, installer UI, Inno Setup, release assets) is checked on pull requests only when they touch
      # what it reads; master and manual runs always package.
      package: ${{ github.event_name != 'pull_request' || steps.classify.outputs.installer == 'true' }}
    steps:
      - name: Checkout the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      # The file list comes from the REST API: no history to fetch and no third-party action in the path. Anything but a
      # pull request, and a change too large to list, is treated as "everything changed".
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : > files.txt
          if [[ "$EVENT" == pull_request ]]; then
            # A renamed file counts under both names: moving a packaging file out of its directory must still run its checks.
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
            if [[ $(wc -l < files.txt) -ge 3000 ]]; then : > files.txt; fi
          fi
          python3 scripts/ci/classify-changes.py --output "$GITHUB_OUTPUT" < files.txt

  docs-check:
    name: Documentation links
    needs: changes
    if: needs.changes.outputs.docs_touched == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check relative links and images
        run: python3 scripts/ci/check-doc-links.py --root .

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint (pinned release)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          # style and info findings (quoting habits) are not failures; warnings and errors are
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: Shell syntax of every run block (also msys2 steps, which actionlint skips)
        run: python3 scripts/ci/check-workflow-shell.py
      - name: CI script tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  webui:
    name: Web UI (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The Web UI imports foundation-ui from a sibling directory (package.json: "file:../ds5-ui-m3e"). Pinned to a
      # commit (scripts/ci/foundation-ui.sha) and installed with its dev and peer dependencies: vue is both, and without
      # it three test files fail to load.
      - name: foundation-ui (pinned)
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < scripts/ci/foundation-ui.sha)"
          dir="$GITHUB_WORKSPACE/../ds5-ui-m3e"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/AlkaidLab/foundation-ui "$sha"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          npm ci --prefix "$dir" --no-audit --no-fund

      - name: Install
        run: npm ci --no-audit --no-fund

      # Lint, locale check and build are a few seconds; they run once, in shard 1.
      - name: Lint
        if: matrix.shard == 1
        run: npm run lint:webui

      # One test file (sparxieCapturedGate) takes as long as all the others together, so it is sharded by test
      # (SPARXIE_GATE_SHARD) and the other files by file (node --test-shard); both processes run side by side.
      - name: Tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          dir=src_assets/common/assets/web/tests
          gate=sparxieCapturedGate.test.js
          files=()
          for f in "$dir"/*.test.js; do [ "${f##*/}" = "$gate" ] || files+=("$f"); done
          common=(--import foundation-ui/testing/no-network --test --test-reporter=spec --test-reporter-destination=stdout)
          node "${common[@]}" --test-reporter=junit --test-reporter-destination=webui-junit-files.xml --test-shard="$SHARD/4" "${files[@]}" &
          others=$!
          SPARXIE_GATE_SHARD="$SHARD/4" node "${common[@]}" --test-reporter=junit --test-reporter-destination=webui-junit-gate.xml "$dir/$gate" &
          gate_pid=$!
          status=0
          wait "$others" || status=1
          wait "$gate_pid" || status=1
          exit $status

      - name: Report
        if: always()
        run: python3 scripts/ci/report-junit.py --title "Web UI tests (shard ${{ matrix.shard }}/4)" --min-tests 40 webui-junit-files.xml webui-junit-gate.xml

      - name: Build
        if: matrix.shard == 1
        run: |
          mkdir -p build
          SUNSHINE_SOURCE_ASSETS_DIR="$GITHUB_WORKSPACE/src_assets" SUNSHINE_ASSETS_DIR="$GITHUB_WORKSPACE/build" npm run build

  setup_release:
    name: Setup Release
    needs: changes
    # Only the Windows build reads the release tag and version.
    if: needs.changes.outputs.cpp == 'true'
    outputs:
      publish_release: ${{ steps.setup_release_auto.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_body: ${{ steps.filter_release_contributors.outputs.release_body || steps.setup_release_auto.outputs.release_body || steps.setup_release_manual.outputs.release_body }}
      release_commit: ${{ steps.setup_release_auto.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_release_auto.outputs.release_generate_release_notes || steps.setup_release_manual.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_release_auto.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
      release_version: ${{ steps.setup_release_auto.outputs.release_version || steps.setup_release_manual.outputs.release_version }}
    permissions:
      contents: write  # read does not work to check squash and merge details
    # Pinned: the ubuntu-latest label migrates to Ubuntu 26 (actions/runner-images#14748); move this on purpose, not by label.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Release (Auto)
        id: setup_release_auto
        if: github.event_name != 'workflow_dispatch'
        uses: LizardByte/setup-release-action@v2025.426.225
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          SUFFIX=$([ "${{ github.ref_name }}" = "master" ] && echo "" || echo "-dev")
          echo "publish_release=false" >> $GITHUB_OUTPUT
          echo "release_body=Manual build (${{ github.ref_name }})" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=false" >> $GITHUB_OUTPUT
          echo "release_tag=manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}" >> $GITHUB_OUTPUT
          echo "release_version=manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Filter bot contributors
        id: filter_release_contributors
        if: steps.setup_release_auto.outputs.release_body != ''
        uses: actions/github-script@v9
        env:
          RELEASE_BODY: ${{ steps.setup_release_auto.outputs.release_body }}
        with:
          script: |
            const body = process.env.RELEASE_BODY ?? '';
            const sectionMarker = '## Contributors';
            const sectionStart = body.lastIndexOf(sectionMarker);
            if (sectionStart < 0) {
              core.setOutput('release_body', body);
              return;
            }

            // setup-release-action leaves GitHub's [bot] suffix after each
            // linked author mention. Collect those logins before filtering
            // only the generated contributor-avatar section.
            const botLogins = new Set(
              [...body.matchAll(/\]\(https:\/\/github\.com\/([A-Za-z0-9-]+)\)\[bot\]/gi)]
                .map(([, login]) => login.toLowerCase()),
            );
            const contributors = body.slice(sectionStart);
            const filteredContributors = contributors.replace(
              /<a\b[^>]*\bhref="https:\/\/github\.com\/([A-Za-z0-9-]+)"[^>]*>[\s\S]*?<\/a>/gi,
              (anchor, login) => {
                if (!botLogins.has(login.toLowerCase())) return anchor;
                core.info(`Omitting bot from contributor avatars: ${login}`);
                return '';
              },
            );

            core.setOutput('release_body', body.slice(0, sectionStart) + filteredContributors);

  vdd_smoke:
    name: VDD helper smoke tests
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run VDD helper smoke tests
        shell: pwsh
        run: |
          & .\src_assets\windows\misc\vdd\smoke-test-vdd-device-helper.ps1
          & .\src_assets\windows\misc\vdd\smoke-test-install-vdd-selection.ps1

  mat_smoke:
    name: MAT software regressions
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run own-process MAT regressions
        shell: pwsh
        run: |
          git submodule update --init --depth 1 third-party/moonlight-common-c
          if ($LASTEXITCODE) { throw 'MAT dependency checkout failed' }
          ./tools/sonic-mat-live/build.ps1 -Output build/mat-smoke
          ./tools/sonic-mat-live/test-manage-live.ps1 -Output build/mat-operator

  build_win:
    name: Windows
    needs: [changes, setup_release]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
      actions: write  # prune stale ccache entries after saving this run's
    runs-on: windows-latest
    steps:
      # Several Web UI tests match source text with \n in their patterns: check the sources out with LF on Windows too.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
          # About fifty submodules: fetch them in parallel instead of one by one.
          GIT_CONFIG_KEY_1: submodule.fetchJobs
          GIT_CONFIG_VALUE_1: '8'

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          # Required, not redundant with the `pacman -Syu` below. When
          # msys2-runtime itself needs upgrading, pacman closes every MSYS2
          # process to finish the job, which kills the workflow shell and fails
          # the step with exit 1. setup-msys2 performs that upgrade with the
          # restart it needs; by the time our own step runs, the runtime is
          # already current and only the dependency list is left to install.
          update: true
          install: >-
            wget
            curl

      - name: Update Windows dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          # download pinned opus version
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget https://repo.msys2.org/mingw/ucrt64/${opus_tarball}

          # install dependencies
          # NOTE: gcc/gcc-libs were previously pinned to 15.1.0-5 to work around
          # a broken upstream gcc 15.x. Since msys2 has moved on to gcc 16.x and
          # other packages (cmake, etc.) now require gcc-libs 16.x ABI, pinning
          # an old gcc-libs causes cmake.exe to silently fail to load (exit 127).
          # Let pacman install the full toolchain at the current upstream version.
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-ccache"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-lld"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            # "mingw-w64-ucrt-x86_64-nodejs"  # Replaced by actions/setup-node (vite 8 requires MSVC Node.js)
            # "mingw-w64-ucrt-x86_64-nsis"  # Replaced by Inno Setup
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )

          pacman -Syu --noconfirm "${dependencies[@]}"

          # install pinned opus after Syu to prevent upgrade
          pacman --noconfirm -U ${opus_tarball}

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which cmake || (echo "cmake not found" && exit 1)
          which ninja || (echo "ninja not found" && exit 1)
          which gcc || (echo "gcc not found" && exit 1)
          
          echo "All build tools verified successfully"
          echo "  CMake: $(cmake --version | head -1)"
          echo "  Ninja: $(ninja --version)"
          echo "  GCC: $(gcc --version | head -1)"

      # Packaging needs the Web UI build, the installer's setup UI and the Inno Setup package; pull requests that touch none
      # of what packaging reads skip them (job `changes`, output `package`). Web UI lint and tests run in the `webui` jobs.
      - name: Setup Node.js
        if: needs.changes.outputs.package == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The Web UI imports foundation-ui from a sibling checkout named ds5-ui-m3e (package.json: "file:../ds5-ui-m3e"),
      # pinned to the commit in scripts/ci/foundation-ui.sha. A full install: the checkout resolves vue and the SFC compiler
      # from its own node_modules, and both are dev/peer dependencies there. pwsh does not stop on a failing native command
      # by itself; the preference below does.
      - name: Fetch foundation-ui
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sha = (Get-Content scripts/ci/foundation-ui.sha -Raw).Trim()
          $dir = "$env:GITHUB_WORKSPACE/../ds5-ui-m3e"
          git init -q $dir
          git -C $dir fetch -q --depth 1 https://github.com/AlkaidLab/foundation-ui $sha
          git -C $dir -c advice.detachedHead=false checkout -q FETCH_HEAD
          npm ci --prefix $dir

      - name: Build Web UI
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          # A failing native command fails the step (PowerShell 7.4+; the runner already sets ErrorActionPreference=Stop).
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:SUNSHINE_SOURCE_ASSETS_DIR = "${{ github.workspace }}\src_assets"
          $env:SUNSHINE_ASSETS_DIR = "${{ github.workspace }}\build"
          npm run build

      # The installer's setup UI: pages (foundation-ui) and Tauri window, built from the committed Panel submodule, so it is
      # the Panel build boundary the pinned GUI below belongs to (scripts/build-setup-ui.ps1, docs/installer-webui.md).
      - name: Build installer setup UI
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/build-setup-ui.ps1 `
            -FoundationUi "$env:GITHUB_WORKSPACE/../ds5-ui-m3e" `
            -Output "$env:RUNNER_TEMP/installer-inputs/foundation-setup-ui.exe"
          "SETUP_UI_EXE=$env:RUNNER_TEMP/installer-inputs/foundation-setup-ui.exe" >> $env:GITHUB_ENV

      - name: Cache compiler objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\.ccache
          # The key is unique per run; the prefix restore-key is what actually
          # produces the hits: every run seeds itself from the most recent
          # previous one. Saving is split out below so that only master
          # writes: PR-branch entries are invisible to other branches yet
          # still consume the shared cache quota, and when that quota fills
          # (10 GB, LRU), eviction wiped the whole lineage once and forced a
          # full 47-minute cold rebuild.
          key: ccache-windows-${{ github.run_id }}
          restore-keys: |
            ccache-windows-

      # The Panel bundle and the WebView2 bootstrapper, pinned by tag/sha256 in scripts/installer-inputs.json and verified (never
      # "latest"). The pinned Panel commit must be the committed submodule. A manual run with gui_run_id replaces the GUI below.
      - name: Fetch pinned installer inputs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dest = "$env:RUNNER_TEMP/installer-inputs/pinned"
          ./scripts/fetch-installer-inputs.ps1 -Destination $dest
          "GUI_BUNDLE_DIR=$dest/gui" >> $env:GITHUB_ENV
          "WEBVIEW2_BOOTSTRAPPER=$dest/MicrosoftEdgeWebview2Setup.exe" >> $env:GITHUB_ENV

      - name: Fetch paired GUI artifact
        if: github.event_name == 'workflow_dispatch' && inputs.gui_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_RUN_ID: ${{ inputs.gui_run_id }}
        run: |
          $arguments = @{ Destination = "$env:RUNNER_TEMP/paired-gui" }
          if ($env:GUI_RUN_ID) { $arguments.RunId = $env:GUI_RUN_ID }
          ./scripts/fetch-paired-gui.ps1 @arguments
          "GUI_BUNDLE_DIR=$env:RUNNER_TEMP/paired-gui" >> $env:GITHUB_ENV

      - name: Configure Windows
        id: configure_windows
        shell: msys2 {0}
        env:
          # Only trusted events may expose the read-only token to PR-controlled CMake code.
          GITHUB_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
          # Same-repository PRs are trusted; fork PRs never receive the private credential.
          RTX_VIDEO_SDK_URL: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.RTX_VIDEO_SDK_URL || '' }}
          RTX_VIDEO_SDK_TOKEN: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.DRIVER_DOWNLOAD_TOKEN || '' }}
          RTX_VIDEO_NGX_APPLICATION_ID: ${{ (github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && secrets.RTX_VIDEO_NGX_APPLICATION_ID || '' }}
          SUNSHINE_RTX_HDR: ${{ !(github.repository == 'AlkaidLab/foundation-sunshine' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'AlkaidLab/foundation-sunshine')) && 'OFF' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') && 'ON' || inputs.rtx_hdr || 'AUTO' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          # Build identity (cmake/prep/build_info.cmake): master builds carry the full commit too. A published build is a
          # pre-release (beta); PRs and manual runs are dev builds. One build makes both packages, so the package stays auto.
          SUNSHINE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SUNSHINE_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          SUNSHINE_BUILD_CHANNEL: ${{ needs.setup_release.outputs.publish_release == 'true' && 'beta' || 'dev' }}
          SUNSHINE_BUILD_BUILDER: ci
          SUNSHINE_BUILD_CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # ccache.exe is a native binary, so it reads the Windows-style path
          # straight out of the environment even under the msys2 shell.
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          # `pacman -Syu` can move the toolchain underneath us between runs.
          # Hashing the compiler binary instead of its mtime keeps the cache
          # valid across runs that did not actually change gcc.
          CCACHE_COMPILERCHECK: content
          # Fork PRs still try every public dependency. Keep the build usable
          # when a release asset is temporarily unavailable; official builds
          # continue to require the complete driver set.
          DRIVER_DEPS_REQUIRED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'OFF' || 'ON' }}
        run: |
          mkdir -p build
          ccache --zero-stats
          # The msys2 shell starts with a minimal PATH, so the runner's .NET SDK (C:\Program Files\dotnet) is invisible to CMake
          # and tools/sparxie-launch would silently not be built or shipped.
          export PATH="$PATH:/c/Program Files/dotnet"
          gui_options=()
          if [[ -n "${GUI_BUNDLE_DIR:-}" ]]; then
            gui_options=(-DFETCH_GUI=OFF "-DGUI_DIR=$GUI_BUNDLE_DIR")
          fi
          cmake \
            -B build \
            -G Ninja \
            -S . \
            "${gui_options[@]}" \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_RTX_HDR="$SUNSHINE_RTX_HDR" \
            -DBUILD_TESTS=ON \
            -DBUILD_TRAY_TESTS=ON \
            -DBUILD_WEB_UI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DDRIVER_DEPS_REQUIRED=${DRIVER_DEPS_REQUIRED} \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/AlkaidLab/foundation-sunshine' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/AlkaidLab/foundation-sunshine/issues'
          if grep -q '^SUNSHINE_RTX_HDR_AVAILABLE:INTERNAL=TRUE' build/CMakeCache.txt; then
            echo 'rtx_hdr=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rtx_hdr=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          ninja -C build
          ccache --show-stats --verbose

      - name: Run native tests
        shell: msys2 {0}
        run: ctest --test-dir build --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/ctest.xml"

      # Annotations and a job summary from the JUnit file; fails when no test ran, when fewer than --min-tests ran (a
      # registered suite that disappeared) and when a test not listed in scripts/ci/allowed-skips.txt was skipped.
      - name: Report native tests
        if: always()
        shell: pwsh
        run: python scripts/ci/report-junit.py --title "Native tests" --min-tests 80 --allowed-skips scripts/ci/allowed-skips.txt ctest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ctest.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Save compiler cache
        # Only master writes (always(): a failed or cancelled build still
        # produced valid objects). PR runs restore master's entry, so they
        # don't need to save, and skipping their saves keeps the shared
        # cache quota flat.
        if: always() && github.ref == 'refs/heads/master'
        id: ccache_save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-${{ github.run_id }}

      - name: Prune stale compiler cache entries
        # Collapse the cache to exactly one entry (the newest one saved).
        # Entries pile up one-per-run otherwise; on a 10 GB repo quota that
        # once got the entire lineage LRU-evicted. A single entry is also
        # restored by every later run, which keeps resetting its 7-day
        # inactivity clock, so neither eviction path can take it out.
        # Only entries from runs OLDER than this one are deleted (run ids
        # increase monotonically): a cancelled run still executes its
        # always() save and prune alongside the next run, and age-filtered
        # prunes converge to the newest entry under any interleaving —
        # pruning by "not my key" instead could race down to zero entries.
        # Skipped unless the save step actually succeeded (outcome keeps the
        # real result under continue-on-error; the save subaction sets no
        # outputs, so conclusion can't tell success from failure).
        if: always() && github.ref == 'refs/heads/master' && steps.ccache_save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = "ccache-windows-${{ github.run_id }}"
          # Page through the caches API instead of `gh cache list`: the
          # latter caps at --limit 100, and once this repo's other caches
          # (msys2, npm, ...) grow past that, stale ccache entries would
          # fall outside the window and never get pruned.
          $stale = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | test("^ccache-windows-[0-9]+$")) | [(.key | sub("^ccache-windows-";"") | tonumber), .id, .key] | @tsv' |
            Where-Object { $_ } |
            ForEach-Object {
              $parts = $_ -split "`t"
              if ([long]$parts[0] -lt [long]"${{ github.run_id }}") {
                [pscustomobject]@{ Id = $parts[1]; Key = $parts[2] }
              }
            }
          foreach ($entry in $stale) {
            gh cache delete $entry.Id --repo $env:GITHUB_REPOSITORY
            Write-Output "Pruned $($entry.Key)"
          }
          Write-Output "Pruned $(@($stale).Count) stale ccache entries; kept $current"

      - name: Cache Inno Setup
        if: needs.changes.outputs.package == 'true'
        id: inno-cache
        uses: actions/cache@v6
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6.7.3

      - name: Install Inno Setup
        if: needs.changes.outputs.package == 'true' && steps.inno-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The unversioned jrsoftware.org/download.php/is.exe link now serves an
          # HTML page. Pin the signed release asset (6.x keeps the "Inno Setup 6"
          # install path used below) and check its publisher before running it.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -cne 'Pyrsys B.V.') {
            throw "Unexpected Inno Setup installer signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait

      - name: Add Inno Setup to PATH
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Package Windows
        if: needs.changes.outputs.package == 'true'
        shell: msys2 {0}
        env:
          RTX_VIDEO_ADAPTER_BUILT: ${{ steps.configure_windows.outputs.rtx_hdr }}
          RTX_VIDEO_ADAPTER_REQUIRED: ${{ github.repository == 'AlkaidLab/foundation-sunshine' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd build

          if [[ "$RTX_VIDEO_ADAPTER_REQUIRED" == "true" && "$RTX_VIDEO_ADAPTER_BUILT" != "true" ]]; then
            echo "Protected master build did not produce the required NVIDIA RTX Video adapter"
            exit 1
          fi

          # Package the Inno Setup installer and portable ZIP.
          # Install into the staging directory first.
          cmake --install . --prefix ./inno_staging
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_rtx_video/foundation_rtx_video_adapter.dll
            test ! -e ./inno_staging/msvcp140.dll
            test ! -e ./inno_staging/vcruntime140.dll
          fi
          test ! -e ./inno_staging/tools/hdr_enhanced/nvidia_rtx_video/nvngx_truehdr.dll
          test ! -e ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/nvngx_dlssnr.dll
          DLSSNR_ADAPTER_BUILT=false
          if [[ -f ./image_enhancement/nvidia_dlssnr_adapter/Release/foundation_dlssnr_adapter.dll ]]; then
            DLSSNR_ADAPTER_BUILT=true
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/foundation_dlssnr_adapter.dll
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-DLSS-LICENSE.txt
            test -f ./inno_staging/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-OPTICAL-FLOW-NOTICES.txt
          fi
          test ! -e ./inno_staging/assets/hdr-components.json
          
          # Run the Inno Setup compiler and prove that it consumed only the
          # lightweight package manifest, not the self-contained runtime.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" sunshine_installer.iss | tee inno-build.log
          if grep -Ei 'nvngx_(truehdr|dlssnr)\.dll' inno-build.log; then
            echo "NVIDIA enhancement runtimes must not be compiled into the installer"
            exit 1
          fi
          if [[ "$DLSSNR_ADAPTER_BUILT" == "true" ]]; then
            grep -F "foundation_dlssnr_adapter.dll" inno-build.log
            grep -F "NVIDIA-DLSS-LICENSE.txt" inno-build.log
            grep -F "NVIDIA-OPTICAL-FLOW-NOTICES.txt" inno-build.log
          fi
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            grep -F "foundation_rtx_video_adapter.dll" inno-build.log
          fi
          
          # Generate the portable ZIP.
          cpack -G ZIP --config ./CPackConfig.cmake --verbose
          cmake -E tar tf ./cpack_artifacts/Sunshine.zip | tr '\\' '/' > portable-files.txt
          if [[ "$RTX_VIDEO_ADAPTER_BUILT" == "true" ]]; then
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_rtx_video/foundation_rtx_video_adapter.dll" portable-files.txt
          fi
          if [[ "$DLSSNR_ADAPTER_BUILT" == "true" ]]; then
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/foundation_dlssnr_adapter.dll" portable-files.txt
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-DLSS-LICENSE.txt" portable-files.txt
            grep -F "Sunshine/tools/hdr_enhanced/nvidia_dlssnr/NVIDIA-OPTICAL-FLOW-NOTICES.txt" portable-files.txt
          fi
          if grep -Ei 'nvngx_(truehdr|dlssnr)\.dll|hdr-components\.json' portable-files.txt; then
            echo "Side-loaded HDR files and mutable trust metadata must not be included in the main portable package"
            exit 1
          fi

          # The engine is not the download: "Assemble installer" wraps it in the shell.
          test -f ./cpack_artifacts/Sunshine-engine.exe
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      # The user-facing installer, the same package tools/append_installer_payload.py makes for a local build
      # (cmake/packaging/windows_innosetup.cmake): [shell][setup UI][WebView2 bootstrapper][Inno engine][footer].
      - name: Assemble installer
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $shell = 'build/tools/sunshine-installer-shell.exe'
          $engine = 'build/cpack_artifacts/Sunshine-engine.exe'
          $output = 'artifacts/sunshine-windows-installer.exe'
          python tools/append_installer_payload.py $shell $engine $output --ui $env:SETUP_UI_EXE --wv2 $env:WEBVIEW2_BOOTSTRAPPER
          # Read the footer back: every section is present and carries the hash of the file it was made from.
          $bytes = [IO.File]::ReadAllBytes($output)
          $tail = [Text.Encoding]::ASCII.GetString($bytes, [Math]::Max(0, $bytes.Length - 2048), [Math]::Min(2048, $bytes.Length))
          $footer = $tail.Substring($tail.LastIndexOf("ALKAID-SHELL-PAYLOAD-V1"))
          foreach ($section in @(@('', $engine), @('ui-', $env:SETUP_UI_EXE), @('wv2-', $env:WEBVIEW2_BOOTSTRAPPER))) {
            $hash = (Get-FileHash -LiteralPath $section[1] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($footer -notmatch "(?m)^$($section[0])sha256=$hash\r?$") { throw "Installer footer lacks $($section[0])sha256=$hash" }
          }
          Write-Output $footer

      - name: Rename release assets
        if: needs.changes.outputs.package == 'true'
        shell: msys2 {0}
        run: |
          # Format tag to vYEAR.DATE where DATE is zero-padded to 4 digits
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # 重命名安装包和便携版
          INSTALLER_NAME="Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-installer.exe "artifacts/${INSTALLER_NAME}"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.Portable-x64.zip"

          # Legacy Control Panel builds treat any release asset containing
          # "Windows" as a full installer. Keep that marker exclusive to the
          # actual installer so existing users can update to the fixed build.
          for asset in artifacts/*; do
            name=$(basename "$asset")
            lower=${name,,}
            if [[ "$lower" == *windows* && "$lower" != "${INSTALLER_NAME,,}" ]]; then
              echo "Non-installer release asset would confuse legacy updaters: $name"
              exit 1
            fi
          done

      - name: Generate Checksums
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          # Generate SHA256 checksums from the final release asset names.
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Upload Artifacts
        if: needs.changes.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sunshine-windows-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.Portable-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: LizardByte/create-release-action@v2025.426.1549
        with:
          allowUpdates: true
          body: ${{ needs.setup_release.outputs.release_body }}
          generateReleaseNotes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          name: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          prerelease: true
          tag: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          token: ${{ secrets.GH_BOT_TOKEN }}

  # The single status check to require. `always()` is what keeps a failed or cancelled job from being skipped past: a job
  # whose dependency failed is skipped, and a skipped required check counts as passing.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, docs-check, workflow-lint, webui, setup_release, vdd_smoke, mat_smoke, build_win]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was deliberately skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          for name, job in needs.items():
              print(f"{name}: {job['result']}")
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]
          if bad:
              print(f"::error title=CI gate::{bad}")
              sys.exit(1)
          PY
